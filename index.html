<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股估價河流圖</title>
<style>
:root{
  --bg:#0d1117;--panel:#131a24;--panel2:#1a2332;--border:#2a3648;
  --text:#e6edf3;--dim:#8b98a9;--hi:#ff9142;--lo:#53c8f5;--avg:#e6edf3;
  --gold:#ffd54a;--green:#4ade80;--red:#f87171;--accent:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;min-height:100vh}
#root{max-width:1200px;margin:0 auto;padding:16px}
.mono{font-variant-numeric:tabular-nums}
h1{font-size:20px;letter-spacing:2px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 0 16px}
.searchwrap{position:relative;flex:1;min-width:240px;max-width:420px}
.searchbox{display:flex;gap:8px}
.inputwrap{position:relative;flex:1}
.inputwrap input{padding-right:36px}
.clrbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);font-size:14px;padding:6px 10px;border-radius:6px}
.clrbtn:hover{color:var(--text);filter:none}
input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:15px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
button{background:var(--accent);border:none;border-radius:8px;color:#fff;padding:10px 18px;font-size:15px;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:default}
.sugg{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--border);border-radius:8px;margin-top:4px;z-index:20;overflow:hidden}
.sugg div{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between}
.sugg div:hover{background:var(--accent)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.cardtitle{font-size:14px;color:var(--dim);letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cardtitle::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px;display:inline-block}
.infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.infoitem{background:var(--panel2);border-radius:8px;padding:10px 12px}
.infoitem .k{font-size:12px;color:var(--dim)}
.infoitem .v{font-size:17px;margin-top:2px;font-weight:600}
.stockhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stockhead .name{font-size:26px;font-weight:700}
.stockhead .code{font-size:18px;color:var(--dim)}
.stockhead .price{font-size:26px;font-weight:700;color:var(--gold)}
.datastatus{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.statuschip{border:1px solid var(--border);border-radius:999px;color:var(--dim);font-size:11.5px;padding:3px 9px;background:var(--panel2)}
.statuschip.warn{border-color:#92400e;color:#fbbf24;background:#2b1d0a}
.watchbtn{background:var(--panel2);border:1px solid var(--border);color:var(--dim);padding:9px 14px;font-size:14px}
.watchbtn.active{color:var(--gold);border-color:var(--gold)}
.modebtns{display:flex;gap:6px}
.keepbtn{background:var(--panel2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;font-size:13px;border-radius:7px}
.keepbtn.kept{color:var(--gold);border-color:var(--gold)}
.keepbtn:disabled{opacity:0.45;cursor:default;filter:none}
.rmbtn{background:none;border:none;color:var(--dim);padding:2px 6px;font-size:13px}
.rmbtn:hover{color:#ff6b6b;filter:none}
.grpchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.grpchip{background:var(--panel2);border:1px solid var(--border);color:var(--dim);padding:4px 11px;font-size:12.5px;border-radius:14px}
.grpchip.active{color:var(--gold);border-color:var(--gold)}
.grpsel{background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:2px 4px;max-width:110px}
.menubg{position:fixed;inset:0;z-index:40}
.keepmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:41;background:var(--panel2);border:1px solid var(--border);border-radius:9px;min-width:150px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.keepmenu-t{font-size:11px;color:var(--dim);padding:5px 10px 3px}
.keepmenu-i{font-size:13.5px;color:var(--text);padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.keepmenu-i:hover{background:rgba(255,255,255,0.07)}
.keepmenu-i.new{color:var(--gold)}
.scrf{font-size:12.5px;color:var(--dim);font-weight:400;display:flex;align-items:center;gap:5px}
.scrf input{width:70px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12.5px;padding:4px 7px}
.sortth{cursor:pointer;user-select:none;white-space:nowrap}
.sortth:hover{color:var(--text)}
.svband{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.svb{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
.svb .k{font-size:12px;color:var(--dim);margin-bottom:4px}
.svb .v{font-size:22px;font-weight:700}
@media(max-width:700px){.svband{grid-template-columns:repeat(2,1fr)}}
.keyhint{color:var(--dim);font-size:11.5px;border:1px solid var(--border);border-radius:5px;padding:2px 7px}
@media (hover:none){.keyhint{display:none}}
.pricetable tbody tr:hover td{background:rgba(255,255,255,0.03)}
.pricetable{width:100%;border-collapse:collapse;font-size:14px}
.pricetable th,.pricetable td{border:1px solid var(--border);padding:8px 10px;text-align:center}
.pricetable th{background:var(--panel2);color:var(--dim);font-weight:400}
.pricetable td:first-child{background:var(--panel2);color:var(--text);text-align:left}
.hiv{color:var(--hi)}.lov{color:var(--lo)}.avgv{color:var(--gold)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:14px}
.charts.river{grid-template-columns:repeat(2,minmax(0,1fr));max-width:940px;margin:0 auto}
@media(max-width:760px){.charts.river{grid-template-columns:1fr}}
@media(max-width:520px){.charts{grid-template-columns:1fr}}
.chartpanel{background:#000;border:1px solid var(--border);border-radius:12px;padding:8px 8px 4px;--hi:#ff9142;--lo:#53c8f5;--avg:#e6edf3;--gold:#ffd54a;--dim:#8b98a9;--green:#4ade80;--red:#f87171;--accent:#3b82f6;--text:#e6edf3}
.charthead{text-align:center;font-size:15px;font-weight:700;color:#fff;padding:6px 0;background:linear-gradient(90deg,transparent,#1a56db,transparent);border-radius:6px;margin-bottom:4px}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--dim);padding:2px 0 6px}
.legend span::before{content:"—";margin-right:4px;font-weight:700}
.lg-hi::before{color:var(--hi)}.lg-lo::before{color:var(--lo)}.lg-avg::before{color:var(--avg)}.lg-now::before{content:"●";color:var(--gold)}
.verdict{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700}
.v0{background:#0d3a24;color:#4ade80}.v1{background:#123a33;color:#34d399}.v2{background:#3a3312;color:#ffd54a}.v3{background:#3a2412;color:#fb923c}.v4{background:#3a1212;color:#f87171}
.judge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.judge input{width:130px}
.posbar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#16a34a,#eab308,#f87171);flex:1;min-width:200px}
.posmark{position:absolute;top:-4px;width:3px;height:22px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.progress{padding:24px;text-align:center;color:var(--dim)}
.progressbar{height:6px;background:var(--panel2);border-radius:3px;margin:12px auto;max-width:400px;overflow:hidden}
.progressbar div{height:100%;background:var(--accent);transition:width .3s}
.errbox{background:#3a1212;border:1px solid #7f1d1d;color:#fca5a5;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.6}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:8px}
.judgerow{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--dim);padding:10px 18px;font-size:15px;cursor:pointer}
.tab:hover{color:var(--text);filter:none}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.tablewrap{overflow-x:auto;margin-top:8px}
.totoprow{display:flex;justify-content:center;margin-top:12px}
.totopbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px}
.pricetable.small th,.pricetable.small td{padding:5px 9px;font-size:12.5px;white-space:nowrap}
.pricetable.small td{text-align:right}
.pricetable.small td:first-child{text-align:left}
.fcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;margin-bottom:4px}
.fcs .fitem{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--dim)}
.fcs .fitem label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.fcs .fitem input[type=number]{width:56px;padding:3px 6px;font-size:12.5px;border-radius:6px}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js?v=d4cb2d401dc1"></script>
</body>
</html>
